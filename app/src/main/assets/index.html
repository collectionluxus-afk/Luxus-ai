<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luxus AI V4</title>
<style>
:root{--teal:#087d78;--dark:#071b1d;--line:#b9d8d6;--soft:#eef7f6}*{box-sizing:border-box}
body{margin:0;background:#eef1f1;font-family:Arial,Helvetica,sans-serif;color:#102126}button{border:0;border-radius:7px;padding:10px 14px;background:var(--teal);color:white;font-weight:700;cursor:pointer}button.alt{background:#647276}button.red{background:#a74444}
.top{background:var(--dark);color:#fff;padding:13px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.top h1{margin:0;font-size:19px}
.nav,main{max-width:1200px;margin:auto;padding:0 12px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000012}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}label{font-size:11px;font-weight:800;display:block;margin-bottom:4px;color:#345}
input,textarea,select{width:100%;border:1px solid #ccd5d5;border-radius:7px;padding:9px;font:inherit}textarea{min-height:65px}.hidden{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:6px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid var(--line);padding:8px}th{background:var(--teal);color:#fff}.rowcard{border:1px solid #d8e1e1;border-radius:8px;padding:10px;margin:7px 0}
#preview{background:#fff;max-width:1120px;margin:14px auto 30px;overflow:hidden}
.qhead{height:150px;background:var(--dark);color:white;display:flex;position:relative;overflow:hidden}.qhead:after{content:"";position:absolute;right:-100px;top:-170px;width:520px;height:420px;border:5px solid #0fb9b2;border-radius:50%;opacity:.85}
.logo{width:145px;height:145px;object-fit:cover;margin:3px 10px 2px 18px;position:relative;z-index:2}.brand{padding:24px 10px;position:relative;z-index:2;flex:1}.brand h2{font-family:Georgia,serif;font-size:40px;letter-spacing:2px;margin:0}.collection{font-size:17px;letter-spacing:7px;color:#14bcb5}.tag{font-size:12px;margin-top:8px;border-top:1px solid #14bcb5;padding-top:6px;display:inline-block}
.contact{width:360px;background:#f5f8f8;color:#0d3439;padding:19px 20px;position:relative;z-index:2;font-size:12px;line-height:1.55}
.qbody{padding:18px 28px;position:relative}.qtitle{font-size:32px;font-weight:900;letter-spacing:1px;border-bottom:3px solid var(--teal);display:inline-block;margin-bottom:14px}
.meta{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:18px;font-size:12px;margin-bottom:14px}.metaBox{border-right:1px solid #cbdada;padding-right:12px}.metaLine{padding:4px 0;border-bottom:1px solid #d4e0df;display:flex;gap:8px}.metaLine b{min-width:110px}
.qtable td{font-size:12px}.watermark{position:absolute;z-index:0;left:50%;top:355px;transform:translateX(-50%);width:500px;height:390px;object-fit:contain;opacity:.085;filter:grayscale(100%)}
.bottom{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:15px;position:relative;z-index:2}.infoBox{font-size:11px;line-height:1.55}.note{border:1px dashed var(--teal);border-radius:9px;background:var(--soft);padding:10px;font-weight:800;font-size:12px;margin-bottom:10px}
.totalBox{border:1px solid #9bc6c4;border-radius:9px;overflow:hidden;margin-bottom:12px}.totalRow{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid #c3dddd;font-size:12px}.totalRow:last-child{border:0;background:var(--teal);color:#fff;font-size:17px;font-weight:900}
.terms{font-size:10.5px;line-height:1.5;border-left:2px solid var(--teal);padding-left:12px}.sign{display:flex;justify-content:space-between;align-items:end;margin-top:20px}.footer{background:var(--teal);color:#fff;text-align:center;padding:8px;letter-spacing:2px;font-size:10px;font-weight:bold;margin-top:18px}
@media(max-width:800px){.contact{display:none}.meta,.bottom{grid-template-columns:1fr}.qhead{height:135px}.logo{width:125px;height:125px}.brand h2{font-size:28px}}
@media print{body{background:#fff}.top,.nav,.no-print{display:none!important}main{max-width:none;padding:0}#quoteTab{display:block!important}#preview{margin:0;max-width:none;box-shadow:none}@page{size:A4 portrait;margin:0}}
</style></head><body>
<div class="top"><h1>Luxus AI V4</h1><small>Quotation • Customers • Follow-ups • Orders</small></div>
<div class="nav no-print"><button onclick="tab('quote')">Quotation</button><button onclick="tab('customers')">Customers</button><button onclick="tab('followups')">Follow-ups</button><button onclick="tab('orders')">Orders / Payments</button></div>
<main><section id="quoteTab">
<div class="card no-print"><h3>Quotation Settings</h3><div class="grid">
<div><label>Quotation No.</label><input id="qno"></div><div><label>Date</label><input id="date" type="date"></div><div><label>GST %</label><input id="gst" type="number" min="0" step=".01" value="18"></div><div><label>Validity (days)</label><input id="validity" type="number" value="25"></div>
<div><label>Company Logo</label><input id="logoFile" type="file" accept="image/*" onchange="loadLogo(this)"></div><div><label>Company Address</label><input id="address" value="T-179, New Model Basti, Rani Jhansi Road, Near Filmistan, Delhi -110006"></div>
</div></div>
<div class="card no-print"><h3>Buyer Details</h3><div class="grid">
<div><label>Buyer</label><input id="buyer"></div><div><label>Email</label><input id="email"></div><div><label>GSTIN</label><input id="bgst"></div><div><label>PAN</label><input id="pan"></div><div><label>WhatsApp / Phone</label><input id="phone"></div><div><label>Buyer Order No.</label><input id="buyerOrder"></div><div><label>Destination</label><input id="destination"></div><div><label>Despatched Through</label><input id="dispatch"></div>
</div></div>
<div class="card no-print"><h3>Products</h3><table id="items"><thead><tr><th>Product / Description</th><th>Qty</th><th>Rate</th><th>Amount</th><th></th></tr></thead><tbody></tbody></table><div class="actions" style="margin-top:8px"><button onclick="addItem()">+ Add Item</button></div></div>
<div class="card no-print"><h3>Always-Ready Terms <span style="font-size:11px;color:#777">(editable)</span></h3><div class="grid">
<div><label>Packing / Transportation</label><textarea id="packing">PACKING & TRANSPORTATION CHARGES EXTRA</textarea></div><div><label>Payment</label><textarea id="payment">50% Advance, Remaining Before Dispatch</textarea></div><div><label>Delivery Time</label><textarea id="delivery">As per discussed</textarea></div><div><label>Tax Note</label><textarea id="taxnote">GST @ applicable rate on all items (or as per Govt. law at the time of delivery).</textarea></div>
</div></div>
<div class="card no-print actions"><button onclick="saveDraft()">Save Draft</button><button class="alt" onclick="loadDraft()">Load Draft</button><button onclick="window.Android ? Android.print() : window.print()">Print / Save PDF</button><button onclick="makeFollowup()">Add Follow-up</button></div>
<div id="preview"></div></section>
<section id="customersTab" class="hidden"><div class="card no-print"><h3>Customers</h3><div class="grid"><div><label>Search</label><input id="cs" oninput="renderCustomers()"></div><div><label>Party Name</label><input id="cn"></div><div><label>Phone</label><input id="cp"></div><div><label>Email</label><input id="ce"></div></div><button onclick="saveCustomer()">Save Customer</button><div id="customerList"></div></div></section>
<section id="followupsTab" class="hidden"><div class="card no-print"><h3>Follow-ups</h3><div id="followList"></div></div></section>
<section id="ordersTab" class="hidden"><div class="card no-print"><h3>Orders / Payments</h3><div class="grid"><div><label>Quotation No.</label><input id="oq"></div><div><label>Party</label><input id="op"></div><div><label>Total</label><input id="ot" type="number"></div><div><label>Advance</label><input id="oa" type="number"></div><div><label>Status</label><select id="os"><option>Quotation</option><option>Order Received</option><option>Production</option><option>Ready</option><option>Dispatched</option><option>Delivered</option><option>Paid</option></select></div></div><button onclick="saveOrder()">Save Order</button><div id="orderList"></div></div></section>
</main>

$('date').value=new Date().toISOString().slice(0,10);$('qno').value=String((+(localStorage.luxusLastQ||176))+1).padStart(5,'0');
function money(n){return (+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}function items(){return [...document.querySelectorAll('#items tbody tr')].map(r=>({d:r.querySelector('.d').value,q:+r.querySelector('.q').value||0,r:+r.querySelector('.r').value||0}))}
function addItem(d='',q='',r=''){let tr=document.createElement('tr');tr.innerHTML=`<td><input class="d" value="${d}"></td><td><input class="q" type="number" value="${q}"></td><td><input class="r" type="number" step=".01" value="${r}"></td><td class="a">0.00</td><td><button class="red" onclick="this.closest('tr').remove();update()">×</button></td>`;$('items').querySelector('tbody').appendChild(tr);tr.querySelectorAll('input').forEach(x=>x.addEventListener('input',update));update()}
function calc(){let rows=items(),sub=rows.reduce((s,x)=>s+x.q*x.r,0),g=sub*(+$('gst').value||0)/100;return{rows,sub,g,total:sub+g}}
function update(){let x=calc();[...document.querySelectorAll('#items tbody tr')].forEach((r,i)=>r.querySelector('.a').textContent=money(x.rows[i].q*x.rows[i].r));let logo=localStorage.luxusLogo||logoDefault;
$('preview').innerHTML=`<div class="qhead"><img class="logo" src="${logo}"><div class="brand"><h2>LUXUS</h2><div class="collection">COLLECTION</div><div class="tag">MANUFACTURER OF ALL KIND OF BAGS</div></div><div class="contact"><b>📍</b> ${$('address').value}<br>✉ collectionluxus@gmail.com<br>☎ 7827777765<br><b>GSTIN : 07AGBPF0467F1ZU</b></div></div>
<div class="qbody"><img class="watermark" src="${bagDefault}"><div class="qtitle">QUOTATION</div>
<div class="meta"><div class="metaBox"><div><b>Buyer:</b> ${$('buyer').value}</div><div><b>E-Mail:</b> ${$('email').value}</div><div class="metaLine"><b>GSTIN:</b><span>${$('bgst').value}</span></div><div class="metaLine"><b>PAN:</b><span>${$('pan').value}</span></div></div>
<div class="metaBox"><div class="metaLine"><b>Buyer Order No.:</b><span>${$('buyerOrder').value}</span></div><div class="metaLine"><b>Despatched through:</b><span>${$('dispatch').value}</span></div><div class="metaLine"><b>Destination:</b><span>${$('destination').value}</span></div></div>
<div><div class="metaLine"><b>Quotation No.:</b><span>${$('qno').value}</span></div><div class="metaLine"><b>Dated:</b><span>${$('date').value}</span></div><div class="metaLine"><b>Delivery time:</b><span>${$('delivery').value}</span></div></div></div>
<table class="qtable"><thead><tr><th>Sr. No.</th><th>Product Name / Description</th><th>List Price</th><th>Qty</th><th>Amount</th><th>GST %</th><th>GST Amount</th><th>Total</th></tr></thead><tbody>${x.rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${r.d}</b></td><td>${money(r.r)}</td><td>${r.q}</td><td>${money(r.q*r.r)}</td><td>${$('gst').value}%</td><td>${money(r.q*r.r*(+$('gst').value||0)/100)}</td><td>${money(r.q*r.r*(1+(+$('gst').value||0)/100))}</td></tr>`).join('')}</tbody></table>
<div class="bottom"><div class="infoBox"><div class="note">📦 ${$('packing').value}</div><p><b>Mode / Terms of payment</b><br>${$('payment').value}</p><p><b>Bank Details</b><br>Bank Name : Union Bank of India, Branch Pahari Dhiraj<br>Account Holder Name : Luxus Collection<br>Account No. : 095311010000024<br>IFSC Code : UBIN0809535</p><p><b>Delivery time</b><br>${$('delivery').value}</p><div class="sign"><div><i>Thanking you,</i><br><b>For, LUXUS COLLECTION</b></div><div>____________________<br><b>Authorised Signatory</b></div></div></div>
<div><div class="totalBox"><div class="totalRow"><span>GST - ${$('gst').value}%</span><b>${money(x.g)}</b></div><div class="totalRow"><span>Packing & Transportation Charges</span><b>Extra</b></div><div class="totalRow"><span>G. Total</span><b>₹ ${money(x.total)}</b></div></div><div class="terms"><b>Terms & Conditions</b><ol><li>Once the goods is ordered, no cancellation shall be accepted. If so, the advance received shall be forfeited.</li><li><b>Validity:</b> ${$('validity').value} days from date of quotation. Thereafter it needs our written confirmation.</li><li><b>Tax:</b> ${$('taxnote').value}</li><li><b>Payment:</b> ${$('payment').value}</li><li><b>MSME:</b> MSME NOT REGISTER</li></ol></div></div></div><div class="footer">QUALITY BAGS &nbsp; | &nbsp; TRUSTED PARTNER &nbsp; | &nbsp; LUXUS COLLECTION</div></div>`}
function loadLogo(inp){let f=inp.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{localStorage.luxusLogo=rd.result;update()};rd.readAsDataURL(f)}function saveDraft(){let d={qno:$('qno').value,date:$('date').value,gst:$('gst').value,validity:$('validity').value,address:$('address').value,buyer:$('buyer').value,email:$('email').value,bgst:$('bgst').value,pan:$('pan').value,phone:$('phone').value,buyerOrder:$('buyerOrder').value,destination:$('destination').value,dispatch:$('dispatch').value,packing:$('packing').value,payment:$('payment').value,delivery:$('delivery').value,taxnote:$('taxnote').value,items:items()};localStorage.luxusDraft=JSON.stringify(d);localStorage.luxusLastQ=parseInt(d.qno)||176;alert('Draft saved')}function loadDraft(){let d=JSON.parse(localStorage.luxusDraft||'null');if(!d)return alert('No draft saved');['qno','date','gst','validity','address','buyer','email','bgst','pan','phone','buyerOrder','destination','dispatch','packing','payment','delivery','taxnote'].forEach(k=>$(k).value=d[k]??'');$('items').querySelector('tbody').innerHTML='';d.items.forEach(x=>addItem(x.d,x.q,x.r));update()}
function db(k){try{return JSON.parse(localStorage[k]||'[]')}catch(e){return[]}}function tab(t){['quote','customers','followups','orders'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==t));if(t==='customers')renderCustomers();if(t==='followups')renderFollowups();if(t==='orders')renderOrders()}
function saveCustomer(){let a=db('luxusCustomers'),n=$('cn').value.trim();if(!n)return;let i=a.findIndex(x=>x.n.toLowerCase()===n.toLowerCase());let o={n,phone:$('cp').value,email:$('ce').value};i>=0?a[i]=o:a.push(o);localStorage.luxusCustomers=JSON.stringify(a);renderCustomers()}function renderCustomers(){let q=($('cs').value||'').toLowerCase(),a=db('luxusCustomers').filter(x=>(x.n+x.phone+x.email).toLowerCase().includes(q));$('customerList').innerHTML=a.map((x,i)=>`<div class="rowcard"><b>${x.n}</b> · ${x.phone||''} · ${x.email||''} <button onclick="useCustomer(${i})">Use</button></div>`).join('')||'No customers saved.'}function useCustomer(i){let x=db('luxusCustomers')[i];$('buyer').value=x.n;$('phone').value=x.phone||'';$('email').value=x.email||'';tab('quote');update()}
function makeFollowup(){let a=db('luxusFollowups');a.push({party:$('buyer').value||'Party',phone:$('phone').value,q:$('qno').value,date:new Date(Date.now()+86400000).toISOString().slice(0,10),status:'Pending'});localStorage.luxusFollowups=JSON.stringify(a);alert('Follow-up added for tomorrow')}function renderFollowups(){let a=db('luxusFollowups');$('followList').innerHTML=a.map((x,i)=>`<div class="rowcard"><b>${x.party}</b> · Q ${x.q} · ${x.date} · ${x.status}</div>`).join('')||'No follow-ups.'}
function saveOrder(){let a=db('luxusOrders'),t=+$('ot').value||0,ad=+$('oa').value||0;a.push({q:$('oq').value,p:$('op').value,total:t,advance:ad,balance:t-ad,status:$('os').value});localStorage.luxusOrders=JSON.stringify(a);renderOrders()}function renderOrders(){let a=db('luxusOrders');$('orderList').innerHTML=a.map(x=>`<div class="rowcard"><b>${x.p}</b> · Q ${x.q} · ${x.status}<br>Total ₹${money(x.total)} · Advance ₹${money(x.advance)} · Balance ₹${money(x.balance)}</div>`).join('')||'No orders.'}
document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',update));addItem('JUTE POUCH WITH PRINTING',1400,135);addItem('CANVAS POUCH WITH PRINTING',1400,165);update();
</script></body></html>
